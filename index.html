<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b0a" />
    <meta name="description" content="可用鼠标、触屏或键盘游玩的 3D 黑白棋与无尽卡牌模式。" />
    <title>黑白棋 · 3D 解压版</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="inactive" aria-hidden="true"></div>
    <main id="home" class="home" aria-labelledby="home-title">
      <div class="home-inner">
        <div class="home-brand" aria-hidden="true">
          <span class="brand-disc brand-disc-black"></span>
          <span class="brand-disc brand-disc-white"></span>
        </div>
        <h1 class="home-title" id="home-title">黑白棋 <span class="home-sub">3D 解压版</span></h1>
        <p class="home-tagline">策略对抗 · 手感解压 · 每一步都有音画反馈</p>
        <div class="mode-cards">
          <button class="mode-card" id="mode-classic" type="button" aria-describedby="classic-desc">
            <span class="mode-visual mode-visual-classic" aria-hidden="true">
              <span class="mode-disc mode-disc-black"></span>
              <span class="mode-disc mode-disc-white"></span>
            </span>
            <span class="mode-copy">
              <span class="mode-name">经典模式</span>
              <span class="mode-desc" id="classic-desc">纯粹翻转对弈,角位争夺决定胜负</span>
            </span>
            <i class="mode-arrow" data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
          <button class="mode-card" id="mode-cards" type="button" aria-describedby="cards-desc">
            <span class="mode-visual mode-visual-cards" aria-hidden="true">
              <i data-lucide="layers-3"></i>
            </span>
            <span class="mode-copy">
              <span class="mode-name">无尽卡牌 <span class="badge">策略</span></span>
              <span class="mode-desc" id="cards-desc">行动力组牌,留牌反制,逆风追赶</span>
            </span>
            <i class="mode-arrow" data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
        </div>
        <p class="home-tip">黑棋先行 · 点击发光格子落子 · 拖拽旋转视角 · R 重开 / U 悔棋 / M 静音</p>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
